# Tonalitaet: welche Woerter zu einem Ton passen. Ein Wort darf mehrere Toene
# tragen oder keinen. Jedes Wort hier muss oben in `words` stehen.
tones:
  dark: [
    dunkel, finster, schattig, trübe, nebelig, rußig, heimlich, verborgen, geheim,
    unsichtbar, lautlos, grimmig, einsam, abgelegen, tief, fern, still, kalt, eisig
